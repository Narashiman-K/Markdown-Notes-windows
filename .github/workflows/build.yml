name: Build

# GitHub's windows runners ship the Windows SDK, so `makeappx.exe` is present
# and the MSIX/AppX package builds without installing anything locally. That is
# why Store packages are produced here rather than on a development machine.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Some machines set NODE_ENV=production globally, which makes npm skip
          # devDependencies. Everything this project builds with lives there.
          NODE_ENV: development

      - name: Set up Python for the test fixtures
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate sample documents
        run: |
          python -m pip install --quiet python-docx openpyxl reportlab python-pptx
          python samples/make.py

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npx electron-vite build

      - name: End-to-end smoke test
        run: npm run smoke
        env:
          MARKNOTE_SMOKE: '1'

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: out/smoke/*.png
          if-no-files-found: ignore

  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development

      - name: Build
        run: npx electron-vite build

      - name: Build installer (NSIS)
        run: npx electron-builder --win nsis --x64 --arm64 --publish never

      - name: Build Store package (MSIX/AppX)
        # Not signed on purpose: Microsoft re-signs Store submissions during
        # certification, and a self-signed package would be rejected.
        run: npx electron-builder --win appx --x64 --arm64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            release/*.exe
            release/*.appx
            release/*.msix
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.appx

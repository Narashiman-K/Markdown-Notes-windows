name: Build

# GitHub's windows runners ship the Windows SDK, so `makeappx.exe` is present
# and the MSIX/AppX package builds without installing anything locally. That is
# why Store packages are produced here rather than on a development machine.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Some machines set NODE_ENV=production globally, which makes npm skip
          # devDependencies. Everything this project builds with lives there.
          NODE_ENV: development

      - name: Set up Python for the test fixtures
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generate sample documents
        run: |
          python -m pip install --quiet python-docx openpyxl reportlab python-pptx pillow
          python samples/make.py

      - name: Security audit gate
        # Fails on any high or critical advisory not listed, with a reason and
        # a review date, in audit-allowlist.json (scripts/audit-gate.mjs).
        run: npm run audit:gate

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        # npx bypasses npm scripts, so the prebuild hook that stages the
        # offline OCR engine and language models does not fire. Without this
        # the app builds, but offline OCR has nothing to load: the smoke test
        # failed on it, and packages built here would have shipped without it.
        run: |
          node scripts/tesseract-assets.mjs
          npx electron-vite build

      - name: End-to-end smoke test
        run: npm run smoke
        env:
          MARKNOTE_SMOKE: '1'

      # result.json goes up alongside the screenshots. It holds every check
      # with its recorded detail, which is what you actually need to diagnose
      # a failure, and it is far easier to read than scrolling a web log.
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          path: |
            out/smoke/*.png
            out/smoke/result.json
          if-no-files-found: ignore

  package:
    needs: test
    runs-on: windows-latest
    # Creating a release needs write access to repository contents. The default
    # token is read-only, so without this the packages build correctly and then
    # the attach step fails at the last moment — which is a confusing way to
    # lose a release, since everything up to that point is green.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          NODE_ENV: development

      - name: Build
        # npx bypasses npm scripts, so the prebuild hook that stages the
        # offline OCR engine and language models does not fire. Without this
        # the app builds, but offline OCR has nothing to load: the smoke test
        # failed on it, and packages built here would have shipped without it.
        run: |
          node scripts/tesseract-assets.mjs
          npx electron-vite build

      - name: Build installer (NSIS)
        run: npx electron-builder --win nsis --x64 --arm64 --publish never

      - name: Check the fuses
        # The packaged executable must carry the fuses set in
        # electron-builder.yml. Read back from the built file, so a packaging
        # change that silently drops them fails here, not in users' hands.
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -Recurse -Filter 'Suprasuta Markdown Notes.exe' | Where-Object { $_.DirectoryName -match 'unpacked' } | Select-Object -First 1
          $out = npx --yes @electron/fuses read --app $exe.FullName | Out-String
          Write-Output $out
          $want = 'RunAsNode is Disabled','EnableNodeOptionsEnvironmentVariable is Disabled','EnableNodeCliInspectArguments is Disabled','OnlyLoadAppFromAsar is Enabled','EnableCookieEncryption is Enabled','GrantFileProtocolExtraPrivileges is Disabled','EnableEmbeddedAsarIntegrityValidation is Enabled'
          $missing = $want | Where-Object { $out -notmatch [regex]::Escape($_) }
          if ($missing) { Write-Error ("Fuses not as configured: " + ($missing -join '; ')); exit 1 }

      - name: Build Store package (MSIX/AppX)
        # Not signed on purpose: Microsoft re-signs Store submissions during
        # certification, and a self-signed package would be rejected.
        run: npx electron-builder --win appx --x64 --arm64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          path: |
            release/*.exe
            release/*.appx
            release/*.msix
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.appx

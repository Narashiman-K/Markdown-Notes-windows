appId: com.suprasuta.markdownnotes
productName: Suprasuta Markdown Notes
copyright: Copyright (c) 2026 Narashiman Krishnamurthy

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/*.map'

asar: true
compression: maximum

# The icon must exist as a real file for BrowserWindow to load it.
extraResources:
  - from: build/icon.ico
    to: icon.ico

# Ship only English resources; each extra locale is a separate .pak file.
electronLanguages: [en-US]

# Electron's fuses: switches compiled into the packaged executable, which no
# setting, environment variable or command-line flag can turn back on. Each
# one closes a way to make the installed app run code it did not ship with.
#   runAsNode                  ELECTRON_RUN_AS_NODE=1 would turn the app into a
#                              plain Node.js runtime for any script.
#   enableNodeOptions...       NODE_OPTIONS could preload arbitrary code.
#   enableNodeCliInspect...    --inspect would open a debugger port.
#   onlyLoadAppFromAsar        code is loaded from app.asar only, never from a
#                              loose app/ folder dropped beside it.
#   enableCookieEncryption     cookies on disk are encrypted with the user's
#                              Windows keys.
# Left at Electron's defaults for now, to revisit in Phase 4:
#   enableEmbeddedAsarIntegrityValidation  still experimental outside macOS.
#   grantFileProtocolExtraPrivileges       the app's pages load from file://
#                              today; turning this off first needs them served
#                              from a private protocol instead.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true


fileAssociations:
  - ext: md
    name: Markdown Document
    description: Markdown Document
    role: Editor
    icon: build/icon.ico
  - ext: markdown
    name: Markdown Document
    role: Editor
    icon: build/icon.ico
  - ext: mdown
    name: Markdown Document
    role: Editor
    icon: build/icon.ico

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
  artifactName: Suprasuta-Markdown-Notes-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Suprasuta Markdown Notes
  deleteAppDataOnUninstall: false

# ---------------------------------------------------------------------------
# Microsoft Store (MSIX/AppX).
# These three values are copied verbatim from Partner Center →
# Product management → Product Identity. They must match character for
# character or the upload is rejected.
#   Store ID:  9N1S7QP2WNLX
#   Listing:   https://apps.microsoft.com/detail/9N1S7QP2WNLX
# ---------------------------------------------------------------------------
appx:
  applicationId: SuprasutaMarkdownNotes
  identityName: Narashiman.SuprasutaMarkdownNotes
  publisher: CN=005C2E45-50DB-47BC-8A87-8C363696127C
  publisherDisplayName: Narashiman
  displayName: Suprasuta Markdown Notes
  backgroundColor: '#0f6cbd'
  languages: [en-US]
  showNameOnTiles: true
  setBuildNumber: true


